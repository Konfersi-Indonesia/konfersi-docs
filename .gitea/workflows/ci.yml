# konfersi-docs CI/CD (Gitea Actions). Self-contained: needs no access to other (private) repos.
#
#   validate  every push / PR: frontmatter, en↔id parity, links, allowed HTML, stable slugs exist in the nav
#   publish   push to stg, uat or main (or a manual dispatch on one of them):
#               1. mirror the branch → the same branch of the public GitHub repo over SSH with a
#                  repo-scoped deploy key (backends read raw files from there; git.konfersi.com is internal-only)
#               2. for each env in DOCS_SYNC_ENVS_<BRANCH>: signed, commit-pinned sync on that backend + API smoke
#                  (docs version shown there: <package.json version>+<short sha>)
#   release   a Gitea release is published with tag vX.Y.Z on main (or a manual dispatch on that tag):
#               1. the tag must equal "v" + package.json version, every changelog needs its "## X.Y.Z" entry,
#                  and the tagged commit must be on main
#               2. mirror refs/tags/<tag> to GitHub (same deploy key)
#               3. for each env in DOCS_SYNC_ENVS_RELEASE: signed sync pinned to the tag + API smoke
#                  (docs version shown there: the tag). Unset → notice, mirror only.
#   Branches: PRs merge to stg (stg backend: DOCS_SOURCE_REF=stg), stg → uat (uat backend: DOCS_SOURCE_REF=uat),
#   uat → main, then a release tag on main. Smoke/production follow the release tag (their DOCS_SOURCE_REF is
#   the tag, set by the release pipeline). A branch without DOCS_SYNC_ENVS_<BRANCH> only mirrors.
#   Only publish/release fetch branch or tag refs; validate checks out the commit alone (PR runs have no branch).
#
# Apps check the other direction (every @konfersi/shared DOCS_PAGE they link to exists in the published nav)
# in their own CI: konfersi-landing-page / konfersi-accounts → scripts/check-docs-links.mjs.
#
# Secrets (repo → Settings → Actions → Secrets):
#   GH_MIRROR_DEPLOY_KEY                     private key of the GitHub deploy key (write) on the mirror repo
#   DOCS_WEBHOOK_SECRET_STG|UAT|PRODUCTION   same value as the backend's DOCS_WEBHOOK_SECRET_<ENV> / Worker secret
# Variables (repo → Settings → Actions → Variables):
#   DOCS_GITHUB_MIRROR                       owner/repo of the public mirror, e.g. Konfersi-Indonesia/konfersi-docs
#   DOCS_SYNC_ENVS_STG | _UAT | _MAIN        space-separated envs to sync after that branch publishes, e.g. "stg"
#   DOCS_SYNC_ENVS_RELEASE                   envs that follow release tags, e.g. "production" (unset = mirror only)
#   DOCS_API_BASE_STG|UAT|PRODUCTION         backend origin per env (workers.dev or another host not behind CF Access)

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          # Inline, not actions/checkout: the runner has no Node for JS actions.
          command -v git >/dev/null || apk add --no-cache git
          [ -d .git ] || git init -q .
          URL="https://oauth2:${TOKEN}@git.konfersi.com/${GITHUB_REPOSITORY}.git"
          git remote add origin "$URL" 2>/dev/null || git remote set-url origin "$URL"
          # PR runs have no branch ref to fetch (GITHUB_REF_NAME is the PR number): the commit is enough.
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q -f "${GITHUB_SHA}"
      - name: Install Node.js 22
        run: |
          set -euo pipefail
          # The runner is Alpine: actions/setup-node's glibc build cannot execute there.
          if [ -f /etc/alpine-release ]; then
            apk add --no-cache curl tar ca-certificates libstdc++ libgcc
            curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v22.14.0/node-v22.14.0-linux-x64-musl.tar.gz" \
              | tar -xz -C /usr/local --strip-components=1
          elif ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
          fi
          node -v
      - name: Validate docs
        run: node scripts/validate.mjs

  publish:
    needs: validate
    if: (github.ref == 'refs/heads/stg' || github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        env:
          GH_MIRROR_DEPLOY_KEY: "${{ secrets.GH_MIRROR_DEPLOY_KEY }}"
          DOCS_GITHUB_MIRROR: "${{ vars.DOCS_GITHUB_MIRROR }}"
        run: |
          set -euo pipefail
          missing=""
          [ -n "${GH_MIRROR_DEPLOY_KEY:-}" ] || missing="$missing secret:GH_MIRROR_DEPLOY_KEY"
          echo "${DOCS_GITHUB_MIRROR:-}" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' || missing="$missing var:DOCS_GITHUB_MIRROR(owner/repo)"
          if [ -n "$missing" ]; then
            echo "publish blocked — configure:$missing (see README.md#cicd)" >&2
            exit 1
          fi

      - name: Checkout
        env:
          TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          # Inline, not actions/checkout: the runner has no Node for JS actions.
          command -v git >/dev/null || apk add --no-cache git
          [ -d .git ] || git init -q .
          URL="https://oauth2:${TOKEN}@git.konfersi.com/${GITHUB_REPOSITORY}.git"
          git remote add origin "$URL" 2>/dev/null || git remote set-url origin "$URL"
          git fetch -q origin "${GITHUB_SHA}" "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          # The mirror push needs full history (a workspace reused from validate is shallow).
          if [ -f .git/shallow ]; then git fetch -q --unshallow origin; fi
          git checkout -q -f "${GITHUB_SHA}"

      - name: Skip if the branch moved on
        run: |
          set -euo pipefail
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          # Only the commit that is still the branch tip publishes; a newer push publishes itself.
          if [ "$(git rev-parse "origin/${GITHUB_REF_NAME}")" != "${GITHUB_SHA}" ]; then
            echo "${GITHUB_REF_NAME} moved past ${GITHUB_SHA}; skipping stale publish"
            echo "STALE=1" >> "$GITHUB_ENV"
          fi

      - name: Install Node.js 22
        if: env.STALE != '1'
        run: |
          set -euo pipefail
          # The runner is Alpine: actions/setup-node's glibc build cannot execute there.
          if [ -f /etc/alpine-release ]; then
            apk add --no-cache curl tar ca-certificates libstdc++ libgcc
            curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v22.14.0/node-v22.14.0-linux-x64-musl.tar.gz" \
              | tar -xz -C /usr/local --strip-components=1
          elif ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
          fi
          node -v

      - name: Mirror branch → GitHub
        if: env.STALE != '1'
        env:
          GH_MIRROR_DEPLOY_KEY: "${{ secrets.GH_MIRROR_DEPLOY_KEY }}"
          DOCS_GITHUB_MIRROR: "${{ vars.DOCS_GITHUB_MIRROR }}"
        # The mirror is read-only; git.konfersi.com is the source of truth, so --force is intended.
        run: bash scripts/mirror-push.sh --force "${GITHUB_SHA}:refs/heads/${GITHUB_REF_NAME}"

      - name: Sync + smoke each backend
        if: env.STALE != '1'
        env:
          DOCS_SYNC_ENVS_STG: "${{ vars.DOCS_SYNC_ENVS_STG }}"
          DOCS_SYNC_ENVS_UAT: "${{ vars.DOCS_SYNC_ENVS_UAT }}"
          DOCS_SYNC_ENVS_MAIN: "${{ vars.DOCS_SYNC_ENVS_MAIN }}"
          DOCS_API_BASE_STG: "${{ vars.DOCS_API_BASE_STG }}"
          DOCS_API_BASE_UAT: "${{ vars.DOCS_API_BASE_UAT }}"
          DOCS_API_BASE_PRODUCTION: "${{ vars.DOCS_API_BASE_PRODUCTION }}"
          DOCS_WEBHOOK_SECRET_STG: "${{ secrets.DOCS_WEBHOOK_SECRET_STG }}"
          DOCS_WEBHOOK_SECRET_UAT: "${{ secrets.DOCS_WEBHOOK_SECRET_UAT }}"
          DOCS_WEBHOOK_SECRET_PRODUCTION: "${{ secrets.DOCS_WEBHOOK_SECRET_PRODUCTION }}"
        run: |
          set -euo pipefail
          # Commit-pinned: the backend shows <package.json version>+<short sha>.
          DOCS_SYNC_BRANCH="${GITHUB_REF_NAME}" DOCS_SYNC_COMMIT="${GITHUB_SHA}" \
            bash scripts/sync-envs.sh "DOCS_SYNC_ENVS_$(echo "${GITHUB_REF_NAME}" | tr '[:lower:]' '[:upper:]')"

  release:
    needs: validate
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag
        env:
          EVENT_TAG: "${{ github.event.release.tag_name }}"
          PRERELEASE: "${{ github.event.release.prerelease }}"
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-${GITHUB_REF_NAME}}"
          if [ "${PRERELEASE:-false}" = "true" ]; then
            echo "::notice::${TAG} is a pre-release: docs releases follow published releases only; nothing to do"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release tag '${TAG}' must be vMAJOR.MINOR.PATCH (e.g. v1.4.0)" >&2
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Check configuration
        if: env.SKIP != '1'
        env:
          GH_MIRROR_DEPLOY_KEY: "${{ secrets.GH_MIRROR_DEPLOY_KEY }}"
          DOCS_GITHUB_MIRROR: "${{ vars.DOCS_GITHUB_MIRROR }}"
        run: |
          set -euo pipefail
          missing=""
          [ -n "${GH_MIRROR_DEPLOY_KEY:-}" ] || missing="$missing secret:GH_MIRROR_DEPLOY_KEY"
          echo "${DOCS_GITHUB_MIRROR:-}" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' || missing="$missing var:DOCS_GITHUB_MIRROR(owner/repo)"
          if [ -n "$missing" ]; then
            echo "release blocked — configure:$missing (see README.md#cicd)" >&2
            exit 1
          fi

      - name: Checkout the tag
        if: env.SKIP != '1'
        env:
          TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          # Inline, not actions/checkout: the runner has no Node for JS actions.
          command -v git >/dev/null || apk add --no-cache git
          [ -d .git ] || git init -q .
          URL="https://oauth2:${TOKEN}@git.konfersi.com/${GITHUB_REPOSITORY}.git"
          git remote add origin "$URL" 2>/dev/null || git remote set-url origin "$URL"
          # The tag and main explicitly (full history: the main check and the mirror push need it).
          git fetch -q --force origin "+refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/main:refs/remotes/origin/main"
          if [ -f .git/shallow ]; then git fetch -q --unshallow origin; fi
          git checkout -q -f "refs/tags/${TAG}"
          TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "release tag ${TAG} (${TAG_SHA}) is not on main: tag a commit of main" >&2
            exit 1
          fi
          echo "TAG_SHA=${TAG_SHA}" >> "$GITHUB_ENV"

      - name: Install Node.js 22
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          # The runner is Alpine: actions/setup-node's glibc build cannot execute there.
          if [ -f /etc/alpine-release ]; then
            apk add --no-cache curl tar ca-certificates libstdc++ libgcc
            curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v22.14.0/node-v22.14.0-linux-x64-musl.tar.gz" \
              | tar -xz -C /usr/local --strip-components=1
          elif ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs
          fi
          node -v

      - name: Validate the release
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          node scripts/check-release.mjs "${TAG}"
          node scripts/validate.mjs

      - name: Mirror tag → GitHub
        if: env.SKIP != '1'
        env:
          GH_MIRROR_DEPLOY_KEY: "${{ secrets.GH_MIRROR_DEPLOY_KEY }}"
          DOCS_GITHUB_MIRROR: "${{ vars.DOCS_GITHUB_MIRROR }}"
        # No --force: a release tag never moves. Re-running the same release is a no-op; a mirror tag that points
        # elsewhere fails here instead of being overwritten.
        run: bash scripts/mirror-push.sh "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Sync + smoke each release backend
        if: env.SKIP != '1'
        env:
          DOCS_SYNC_ENVS_RELEASE: "${{ vars.DOCS_SYNC_ENVS_RELEASE }}"
          DOCS_API_BASE_STG: "${{ vars.DOCS_API_BASE_STG }}"
          DOCS_API_BASE_UAT: "${{ vars.DOCS_API_BASE_UAT }}"
          DOCS_API_BASE_SMOKE: "${{ vars.DOCS_API_BASE_SMOKE }}"
          DOCS_API_BASE_PRODUCTION: "${{ vars.DOCS_API_BASE_PRODUCTION }}"
          DOCS_WEBHOOK_SECRET_STG: "${{ secrets.DOCS_WEBHOOK_SECRET_STG }}"
          DOCS_WEBHOOK_SECRET_UAT: "${{ secrets.DOCS_WEBHOOK_SECRET_UAT }}"
          DOCS_WEBHOOK_SECRET_SMOKE: "${{ secrets.DOCS_WEBHOOK_SECRET_SMOKE }}"
          DOCS_WEBHOOK_SECRET_PRODUCTION: "${{ secrets.DOCS_WEBHOOK_SECRET_PRODUCTION }}"
        run: |
          set -euo pipefail
          # Pinned to the tag: those backends (DOCS_SOURCE_REF = a release tag) show exactly "${TAG}".
          DOCS_SYNC_TAG="${TAG}" bash scripts/sync-envs.sh DOCS_SYNC_ENVS_RELEASE
